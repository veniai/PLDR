<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PLDR · P1 可靠采集工作台（Standalone）</title>
    <style>
:root {
  --bg: #050b10;
  --surface-0: #071017;
  --surface-1: #0a151d;
  --surface-2: #0e1c26;
  --surface-3: #122530;
  --line: #1b3544;
  --line-strong: #2b5366;
  --text: #e2edf2;
  --text-soft: #b8cad4;
  --muted: #7f9aaa;
  --cyan: #64d9fb;
  --cyan-soft: rgba(100, 217, 251, 0.12);
  --green: #60d995;
  --green-soft: rgba(96, 217, 149, 0.12);
  --amber: #f3bd64;
  --amber-soft: rgba(243, 189, 100, 0.13);
  --red: #ff7379;
  --red-soft: rgba(255, 107, 114, 0.12);
  --purple: #c892ed;
  --purple-soft: rgba(200, 146, 237, 0.12);
  --blue: #83aaff;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 16px 42px rgba(0, 0, 0, 0.26);
  --sidebar: 226px;
  --topbar: 66px;
  --font-sans: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
}

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 84% -10%, rgba(56, 146, 184, 0.09), transparent 30%),
    var(--bg);
  line-height: 1.6;
}

button,
input,
select,
textarea {
  color: inherit;
  font: inherit;
}

button {
  border: 0;
  background: transparent;
}

a {
  color: inherit;
}

button,
[role="button"] {
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

.boot-screen {
  display: grid;
  min-height: 100vh;
  place-content: center;
  justify-items: center;
  color: var(--muted);
}

.brand-mark {
  display: grid;
  width: 38px;
  height: 38px;
  margin-bottom: 12px;
  place-items: center;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--cyan-soft);
  color: var(--cyan);
  font: 700 18px/1 var(--font-mono);
}

.app-shell {
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  display: flex;
  width: var(--sidebar);
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: rgba(6, 15, 21, 0.97);
}

.sidebar-brand {
  display: flex;
  height: var(--topbar);
  align-items: center;
  gap: 11px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
}

.sidebar-brand strong {
  display: block;
  letter-spacing: 0.08em;
  font-size: 14px;
}

.sidebar-brand small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
}

.nav-section {
  padding: 17px 12px 8px;
}

.nav-label {
  margin: 0 8px 8px;
  color: #668394;
  font: 600 10px/1.2 var(--font-mono);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.nav-button {
  position: relative;
  display: flex;
  width: 100%;
  align-items: center;
  gap: 11px;
  padding: 10px 11px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  text-align: left;
  transition: 140ms ease;
}

.nav-button:hover {
  background: rgba(255, 255, 255, 0.035);
  color: var(--text-soft);
}

.nav-button.active {
  background: var(--cyan-soft);
  color: var(--cyan);
}

.nav-button.active::before {
  position: absolute;
  inset: 9px auto 9px 0;
  width: 2px;
  border-radius: 2px;
  background: var(--cyan);
  content: "";
}

.nav-icon {
  display: grid;
  width: 20px;
  height: 20px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 6px;
  font: 600 10px/1 var(--font-mono);
}

.nav-button .nav-count {
  min-width: 22px;
  margin-left: auto;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  color: currentColor;
  font: 600 11px/1.6 var(--font-mono);
  text-align: center;
}

.sidebar-context {
  margin: auto 12px 14px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface-1);
}

.context-line {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text-soft);
  font-size: 12px;
}

.context-line + .context-line {
  margin-top: 8px;
}

.status-dot {
  width: 7px;
  height: 7px;
  flex: none;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(96, 217, 149, 0.1);
}

.status-dot.amber {
  background: var(--amber);
  box-shadow: 0 0 0 3px rgba(243, 189, 100, 0.1);
}

.sidebar-version {
  margin: 0 12px 18px;
  color: #597485;
  font: 10px/1.5 var(--font-mono);
}

.topbar {
  position: fixed;
  inset: 0 0 auto var(--sidebar);
  z-index: 20;
  display: flex;
  height: var(--topbar);
  align-items: center;
  gap: 14px;
  padding: 0 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(5, 11, 16, 0.88);
  backdrop-filter: blur(16px);
}

.topic-switcher {
  display: flex;
  min-width: 250px;
  align-items: center;
  gap: 10px;
}

.topic-kicker {
  color: var(--muted);
  font: 10px/1.2 var(--font-mono);
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.topic-name {
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
}

.topic-chevron {
  color: var(--muted);
}

.range-pill {
  padding: 5px 9px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-soft);
  font-size: 11px;
}

.topbar-spacer {
  flex: 1;
}

.command-trigger,
.ghost-button,
.primary-button,
.danger-button,
.segmented button,
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-1);
  color: var(--text-soft);
  cursor: pointer;
  transition: 140ms ease;
}

.command-trigger {
  min-width: 178px;
  justify-content: flex-start;
  color: var(--muted);
}

.command-trigger kbd {
  margin-left: auto;
}

kbd {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--muted);
  font: 10px/1.5 var(--font-mono);
}

.ghost-button:hover,
.icon-button:hover,
.command-trigger:hover,
.segmented button:hover {
  border-color: var(--line-strong);
  color: var(--text);
}

.primary-button {
  border-color: rgba(100, 217, 251, 0.42);
  background: var(--cyan-soft);
  color: var(--cyan);
  font-weight: 650;
}

.primary-button:hover {
  border-color: var(--cyan);
  background: rgba(100, 217, 251, 0.18);
}

.primary-button:disabled,
.ghost-button:disabled {
  border-color: var(--line);
  background: var(--surface-1);
  color: #58717f;
  cursor: not-allowed;
  opacity: 0.68;
}

.danger-button {
  border-color: rgba(255, 115, 121, 0.35);
  background: var(--red-soft);
  color: var(--red);
}

.button-small {
  min-height: 30px;
  padding: 0 9px;
  font-size: 12px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.main {
  min-height: 100vh;
  margin-left: var(--sidebar);
  padding: calc(var(--topbar) + 24px) 24px 48px;
}

.screen {
  max-width: 1510px;
  margin: 0 auto;
  animation: screen-in 180ms ease-out;
}

@keyframes screen-in {
  from { opacity: 0; transform: translateY(3px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 19px;
}

.page-eyebrow {
  margin: 0 0 5px;
  color: var(--cyan);
  font: 600 10px/1.4 var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.page-heading h1 {
  margin: 0;
  color: #eef7fa;
  font-size: clamp(23px, 2vw, 30px);
  font-weight: 680;
  letter-spacing: -0.03em;
  line-height: 1.2;
}

.page-heading p {
  max-width: 650px;
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.heading-actions {
  display: flex;
  flex: none;
  align-items: center;
  gap: 8px;
}

.surface {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(10, 21, 29, 0.86);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
}

.surface-header {
  display: flex;
  min-height: 48px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
}

.surface-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
  font-size: 13px;
  font-weight: 650;
}

.surface-title::before {
  width: 3px;
  height: 14px;
  border-radius: 3px;
  background: var(--cyan);
  content: "";
}

.surface-subtitle {
  color: var(--muted);
  font-size: 11px;
}

.surface-body {
  padding: 14px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}

.stat-card {
  position: relative;
  min-height: 118px;
  overflow: hidden;
  padding: 15px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(13, 27, 37, 0.95), rgba(8, 18, 25, 0.95));
  cursor: pointer;
  text-align: left;
}

.stat-card::after {
  position: absolute;
  top: 0;
  right: 0;
  width: 64px;
  height: 2px;
  background: var(--stat-color, var(--cyan));
  content: "";
  opacity: 0.8;
}

.stat-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-1px);
}

.stat-label {
  color: var(--muted);
  font-size: 12px;
}

.stat-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 4px;
}

.stat-value {
  color: var(--text);
  font: 650 32px/1.2 var(--font-mono);
  letter-spacing: -0.05em;
}

.stat-delta {
  color: var(--stat-color, var(--cyan));
  font-size: 11px;
}

.stat-hint {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  color: #6f8a99;
  font-size: 11px;
}

.today-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.8fr);
  gap: 14px;
}

.today-layout > *,
.sources-layout > *,
.change-layout > *,
.events-layout > * {
  min-width: 0;
}

.right-rail {
  display: grid;
  align-content: start;
  gap: 14px;
}

.attention-list {
  display: grid;
}

.attention-card {
  position: relative;
  display: grid;
  grid-template-columns: 8px minmax(0, 1fr) auto;
  gap: 12px;
  padding: 16px 14px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  text-align: left;
}

.attention-card:last-child {
  border-bottom: 0;
}

.attention-card:hover {
  background: rgba(255, 255, 255, 0.02);
}

.priority-rail {
  width: 3px;
  height: 100%;
  min-height: 42px;
  border-radius: 3px;
  background: var(--amber);
}

.priority-rail.medium { background: var(--blue); }
.priority-rail.low { background: var(--muted); }

.attention-main h3 {
  margin: 0;
  color: var(--text);
  font-size: 14px;
  font-weight: 630;
  line-height: 1.5;
}

.attention-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 12px;
  margin: 4px 0 7px;
  color: var(--muted);
  font-size: 11px;
}

.attention-reason {
  margin: 0;
  color: var(--text-soft);
  font-size: 12px;
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.badge,
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  width: fit-content;
  padding: 2px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.025);
  color: var(--muted);
  font-size: 10px;
  line-height: 1.7;
  white-space: nowrap;
}

.status-pill::before {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  content: "";
}

.tone-cyan { color: var(--cyan); border-color: rgba(100, 217, 251, 0.28); background: var(--cyan-soft); }
.tone-green { color: var(--green); border-color: rgba(96, 217, 149, 0.28); background: var(--green-soft); }
.tone-amber { color: var(--amber); border-color: rgba(243, 189, 100, 0.28); background: var(--amber-soft); }
.tone-red { color: var(--red); border-color: rgba(255, 115, 121, 0.28); background: var(--red-soft); }
.tone-purple { color: var(--purple); border-color: rgba(200, 146, 237, 0.28); background: var(--purple-soft); }
.tone-muted { color: var(--muted); }

.attention-go {
  align-self: center;
  color: #597889;
  font-size: 18px;
}

.health-list {
  display: grid;
  gap: 12px;
}

.health-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 5px 12px;
}

.health-row strong {
  font-size: 12px;
  font-weight: 580;
}

.health-row span {
  color: var(--muted);
  font: 11px/1.6 var(--font-mono);
}

.health-track {
  grid-column: 1 / -1;
  height: 4px;
  overflow: hidden;
  border-radius: 4px;
  background: var(--surface-3);
}

.health-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--green);
}

.model-meter {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.model-metric {
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface-0);
}

.model-metric small {
  display: block;
  color: var(--muted);
  font-size: 10px;
}

.model-metric strong {
  display: block;
  margin-top: 3px;
  font: 600 14px/1.5 var(--font-mono);
}

.coverage-note {
  margin-top: 11px;
  padding: 10px 11px;
  border-left: 2px solid var(--amber);
  background: var(--amber-soft);
  color: var(--text-soft);
  font-size: 11px;
}

.mini-map {
  position: relative;
  height: 168px;
  overflow: hidden;
  border-radius: 8px;
  background:
    linear-gradient(rgba(100, 217, 251, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(100, 217, 251, 0.04) 1px, transparent 1px),
    radial-gradient(ellipse at 61% 48%, rgba(48, 102, 120, 0.28), transparent 18%),
    radial-gradient(ellipse at 33% 45%, rgba(48, 102, 120, 0.22), transparent 24%),
    #07141c;
  background-size: 24px 24px, 24px 24px, auto, auto, auto;
}

.mini-map::before,
.mini-map::after {
  position: absolute;
  border: 1px solid rgba(100, 217, 251, 0.16);
  border-radius: 48% 52% 45% 55%;
  background: rgba(52, 104, 118, 0.12);
  content: "";
  transform: rotate(-9deg);
}

.mini-map::before {
  inset: 26px 42% 38px 13%;
}

.mini-map::after {
  inset: 35px 12% 27px 61%;
  transform: rotate(12deg);
}

.map-pin {
  position: absolute;
  z-index: 2;
  left: 57%;
  top: 47%;
  width: 10px;
  height: 10px;
  border: 2px solid var(--bg);
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 7px rgba(243, 189, 100, 0.1);
}

.map-label {
  position: absolute;
  z-index: 2;
  left: calc(57% + 16px);
  top: calc(47% - 5px);
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: rgba(5, 11, 16, 0.9);
  color: var(--text-soft);
  font-size: 10px;
}

.map-caption {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 9px;
  color: var(--muted);
  font-size: 10px;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
}

.filter-button {
  min-height: 31px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 11px;
}

.filter-button.active {
  border-color: rgba(100, 217, 251, 0.38);
  background: var(--cyan-soft);
  color: var(--cyan);
}

.sources-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(330px, 0.65fr);
  gap: 14px;
  align-items: start;
}

.table-scroll {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
}

.data-table {
  width: 100%;
  min-width: 850px;
  border-collapse: collapse;
}

.data-table th {
  height: 38px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  color: #6f8d9e;
  font: 600 10px/1.4 var(--font-mono);
  letter-spacing: 0.06em;
  text-align: left;
  text-transform: uppercase;
}

.data-table td {
  height: 59px;
  padding: 8px 12px;
  border-bottom: 1px solid rgba(27, 53, 68, 0.7);
  color: var(--text-soft);
  font-size: 11px;
  vertical-align: middle;
}

.data-table tbody tr {
  cursor: pointer;
}

.data-table tbody tr:hover,
.data-table tbody tr.selected {
  background: rgba(100, 217, 251, 0.035);
}

.data-table tbody tr.selected td:first-child {
  box-shadow: inset 2px 0 0 var(--cyan);
}

.source-name strong {
  display: block;
  color: var(--text);
  font-size: 12px;
  font-weight: 620;
}

.source-name small {
  color: var(--muted);
  font-size: 10px;
}

.source-detail {
  position: sticky;
  top: calc(var(--topbar) + 20px);
}

.detail-hero {
  padding: 17px 16px 14px;
  border-bottom: 1px solid var(--line);
}

.detail-hero h2 {
  margin: 8px 0 2px;
  font-size: 18px;
  font-weight: 650;
  line-height: 1.35;
}

.detail-hero p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 11px 16px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
}

.detail-field small {
  display: block;
  color: var(--muted);
  font-size: 10px;
}

.detail-field strong {
  display: block;
  margin-top: 2px;
  color: var(--text-soft);
  font: 550 11px/1.6 var(--font-mono);
}

.run-list {
  display: grid;
}

.run-row {
  display: grid;
  grid-template-columns: 72px 76px minmax(0, 1fr);
  gap: 9px;
  padding: 10px 14px;
  border-bottom: 1px solid rgba(27, 53, 68, 0.65);
  align-items: start;
}

.run-row:last-child {
  border-bottom: 0;
}

.run-time {
  color: var(--muted);
  font: 10px/1.7 var(--font-mono);
}

.run-detail {
  color: var(--text-soft);
  font-size: 11px;
}

.run-detail small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font: 10px/1.5 var(--font-mono);
}

.change-layout {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr) 310px;
  gap: 14px;
  align-items: start;
}

.version-list {
  padding: 7px;
}

.version-item {
  position: relative;
  display: block;
  width: 100%;
  padding: 11px 11px 11px 27px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);

.discovery-results {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 9px;
}

.discovery-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 11px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-0);
}

.discovery-summary strong { color: var(--text-soft); font-size: 11px; }
.discovery-summary span { color: var(--muted); font-size: 9px; }

.discovery-result {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 11px;
  border-bottom: 1px solid var(--line);
}

.discovery-result:last-child { border-bottom: 0; }
.result-index { color: var(--cyan); font: 600 10px/1.5 var(--font-mono); }
.discovery-result small { color: var(--cyan); font: 9px/1.5 var(--font-mono); }
.discovery-result strong { display: block; color: var(--text); font-size: 11px; line-height: 1.5; }
.discovery-result p { margin: 2px 0 0; color: var(--muted); font-size: 9px; }

.command-search {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px;
  border-bottom: 1px solid var(--line);
}

.command-search span { color: var(--cyan); }
.command-search input {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  outline: none;
  font-size: 14px;
}

.command-results {
  max-height: 360px;
  overflow: auto;
  padding: 6px;
}

.command-result {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 7px;
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  text-align: left;
}

.command-result:hover { background: var(--surface-3); }
.command-result small { margin-left: auto; color: var(--muted); }

.toast {
  position: fixed;
  z-index: 110;
  right: 22px;
  bottom: 22px;
  display: flex;
  max-width: 420px;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid rgba(96, 217, 149, 0.32);
  border-radius: 9px;
  background: #0b1d19;
  box-shadow: var(--shadow);
  color: var(--text-soft);
  animation: toast-in 180ms ease-out;
}

.toast-mark {
  display: grid;
  width: 20px;
  height: 20px;
  flex: none;
  place-items: center;
  border-radius: 50%;
  background: var(--green-soft);
  color: var(--green);
  font-size: 10px;
}

.toast strong { display: block; color: var(--text); font-size: 11px; }
.toast span { color: var(--muted); font-size: 10px; }

@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.bottom-nav {
  display: none;
}

.empty-state {
  padding: 42px 18px;
  color: var(--muted);
  text-align: center;
}

.empty-state strong {
  display: block;
  color: var(--text-soft);
}

@media (max-width: 1180px) {
  :root { --sidebar: 202px; }
  .change-layout { grid-template-columns: 190px minmax(0, 1fr); }
  .change-layout > :last-child { grid-column: 1 / -1; }
  .review-shell { grid-template-columns: 210px minmax(330px, 1fr) minmax(330px, .95fr); }
  .command-trigger { min-width: 38px; width: 38px; }
  .command-trigger span { display: none; }
}

@media (max-width: 930px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .today-layout, .sources-layout, .events-layout { grid-template-columns: 1fr; }
  .source-detail { position: static; }
  .right-rail { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .right-rail > :last-child { grid-column: 1 / -1; }
  .review-shell { grid-template-columns: 200px minmax(320px, 1fr); }
  .review-pane.candidate-pane { grid-column: 1 / -1; border-top: 1px solid var(--line); }
}

@media (max-width: 820px) {
  :root { --topbar: 58px; }
  body { padding-bottom: 66px; }
  .sidebar { display: none; }
  .topbar { left: 0; padding: 0 13px; }
  .topic-switcher { min-width: 0; }
  .topic-kicker, .range-pill, .topbar .ghost-button { display: none; }
  .topic-name { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .command-trigger kbd { display: none; }
  .command-trigger::before { color: var(--cyan); content: "⌕"; font-size: 16px; }
  .main { margin-left: 0; padding: calc(var(--topbar) + 16px) 12px 22px; }
  .page-heading { align-items: flex-start; margin-bottom: 14px; }
  .page-heading p { font-size: 12px; }
  .heading-actions .ghost-button { display: none; }
  .bottom-nav {
    position: fixed;
    inset: auto 0 0;
    z-index: 50;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    height: 64px;
    border-top: 1px solid var(--line);
    background: rgba(7, 16, 23, 0.97);
    backdrop-filter: blur(16px);
  }
  .bottom-nav button {
    display: grid;
    place-content: center;
    gap: 2px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 9px;
  }
  .bottom-nav button span:first-child { font: 600 12px/1.3 var(--font-mono); }
  .bottom-nav button.active { color: var(--cyan); }
  .review-shell {
    display: block;
    height: auto;
    min-height: 0;
    overflow: visible;
    border: 0;
    background: transparent;
  }
  .review-pane {
    display: none;
    overflow: visible;
    border: 1px solid var(--line) !important;
    border-radius: var(--radius);
  }
  .review-pane.mobile-active { display: block; }
  .pane-header { top: var(--topbar); }
  .mobile-review-steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 10px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface-0);
  }
  .mobile-review-steps button {
    min-height: 36px;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 10px;
  }
  .mobile-review-steps button.active { background: var(--surface-3); color: var(--cyan); }
  .mobile-next {
    position: sticky;
    bottom: 72px;
    z-index: 5;
    display: flex;
    justify-content: flex-end;
    padding: 10px;
    border-top: 1px solid var(--line);
    background: rgba(10, 21, 29, 0.97);
  }
  .toast { right: 12px; bottom: 76px; left: 12px; }
}

@media (max-width: 600px) {
  html { font-size: 13px; }
  .topbar .primary-button { padding: 0 9px; font-size: 11px; }
  .page-heading { gap: 10px; }
  .page-heading h1 { font-size: 22px; }
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { min-height: 100px; padding: 12px; }
  .stat-value { font-size: 26px; }
  .stat-hint { margin-top: 6px; }
  .today-layout { gap: 10px; }
  .attention-card { grid-template-columns: 6px minmax(0, 1fr); padding: 13px 11px; }
  .attention-go { display: none; }
  .right-rail { grid-template-columns: 1fr; }
  .right-rail > :last-child { grid-column: auto; }
  .heading-actions { flex-wrap: wrap; justify-content: flex-end; }
  .change-layout { grid-template-columns: 1fr; }
  .change-layout > :last-child { grid-column: auto; }
  .version-list { display: flex; overflow-x: auto; }
  .version-item { min-width: 148px; padding-left: 24px; }
  .version-item::after { display: none; }
  .split-diff { grid-template-columns: 1fr; }
  .split-column { border-right: 0; border-bottom: 1px solid var(--line); }
  .material-meta { grid-template-columns: 1fr 1fr; }
  .document-copy { padding: 18px 15px 28px; }
  .document-copy h2 { font-size: 18px; }
  .document-copy p { font-size: 12px; }
  .disposition-options { grid-template-columns: 1fr 1fr; }
  .event-hero { padding: 16px; }
  .event-hero h1 { font-size: 21px; }
  .claim-row { grid-template-columns: 28px minmax(0,1fr); }
  .claim-source, .claim-row > .status-pill { grid-column: 2; }
  .capture-grid { grid-template-columns: 1fr; }
  .capture-option.featured { grid-column: auto; }
  .search-form-row { grid-template-columns: 34px minmax(0, 1fr); }
  .search-form-row .primary-button { grid-column: 2; }
  .search-scope-row { padding: 10px 0; }
  .discovery-summary { align-items: flex-start; flex-direction: column; }
  .discovery-result { grid-template-columns: 25px minmax(0, 1fr); }
  .discovery-result .ghost-button { grid-column: 2; justify-self: start; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

    <script type="text/babel" data-presets="env,react">
const TONE_LABELS = {
  changed: ["有变化", "amber"],
  healthy: ["正常", "green"],
  failed: ["失败", "red"],
  retrying: ["重试中", "amber"],
  current: ["当前", "cyan"],
  candidate_ready: ["候选就绪", "purple"],
  generation_failed: ["生成失败", "red"],
  rejected: ["已驳回", "muted"],
  confirmed: ["已入档", "green"],
  no_change: ["无变化", "muted"],
  success: ["已保存", "green"],
  archived: ["已归档", "muted"],
};

function StatusPill({ status, label, tone }) {
  const config = TONE_LABELS[status] || [label || status, tone || "muted"];
  return (
    <span className={`status-pill tone-${tone || config[1]}`}>
      {label || config[0]}
    </span>
  );
}

function NavButton({ item, active, onClick }) {
  return (
    <button className={`nav-button ${active ? "active" : ""}`} onClick={onClick} type="button">

      <span>{item.label}</span>
      {item.count !== undefined && <span className="nav-count">{item.count}</span>}
    </button>
  );
}

function PageHeading({ eyebrow, title, description, actions }) {
  return (
    <header className="page-heading">
      <div>
        <p className="page-eyebrow">{eyebrow}</p>
        <h1>{title}</h1>

}

function Surface({ title, subtitle, actions, children, className = "" }) {

}

function StatCard({ stat, onClick }) {
  const color = {
    cyan: "var(--cyan)",
    amber: "var(--amber)",
    purple: "var(--purple)",

function HealthRow({ label, detail, value, tone = "green" }) {

function DiffViewer({ chunks, mode, onlyChanges, oldLabel = "上一版本", newLabel = "当前版本" }) {
  const visible = onlyChanges ? chunks.filter((chunk) => chunk.type !== "same") : chunks;
  if (mode === "split") {
    return (
      <div className="split-diff">
        <div className="split-column">
          <div className="split-heading">{oldLabel}</div>
          {visible.map((chunk, index) => (
            <div className={`split-line ${chunk.type === "removed" ? "removed" : ""} ${!chunk.old ? "empty" : ""}`} key={`old-${index}`}>
              {chunk.old || "—"}
            </div>
          ))}
        </div>
        <div className="split-column">
          <div className="split-heading">{newLabel}</div>
          {visible.map((chunk, index) => (
            <div className={`split-line ${chunk.type === "added" ? "added" : ""} ${!chunk.next ? "empty" : ""}`} key={`new-${index}`}>
              {chunk.next || "—"}
            </div>
          ))}
        </div>
      </div>
    );
  }
  return (
    <div className="diff-document">
      {visible.map((chunk, index) => (
        <React.Fragment key={index}>
          {chunk.type === "removed" && (
            <div className="diff-line removed"><span className="diff-symbol">−</span><span className="diff-copy">{chunk.old}</span></div>
          )}
          {chunk.type === "added" && (
            <div className="diff-line added"><span className="diff-symbol">+</span><span className="diff-copy">{chunk.next}</span></div>
          )}
          {chunk.type === "same" && (
            <div className="diff-line same"><span className="diff-symbol">·</span><span className="diff-copy">{chunk.next}</span></div>
          )}
        </React.Fragment>
      ))}
    </div>
  );
}

function ReviewQueue({ items, selectedId, onSelect }) {

          <p>{detail.outro}</p>
        </article>
      ) : (

      )}
    </>
  );
}

function CandidatePane({ candidate, disposition, setDisposition, edits, setEdits, onPreview, previewOpen, onConfirm, rejectionReason, setRejectionReason }) {
  const change = (key, value) => setEdits((old) => ({ ...old, [key]: value }));
  const targetText = {
    "新建": `将新建事件“${edits.title}”`,
    "合并": `将合并到 ${candidate.event.match}`,
    "修改": `将修改 ${candidate.event.match} 的摘要与已选主张`,
    "驳回": "不会改变任何正式事件、主张或证据",
  }[disposition];
  const confirmLabel = disposition === "驳回" ? "确认驳回候选" : `确认${disposition}并入档`;
  return (
    <>
      <div className="candidate-banner">
        <span aria-hidden="true">◇</span>
        <span><strong>AI 候选 · 尚未进入正式档案</strong>{candidate.model.name} · {candidate.model.latency} · {candidate.model.tokens} tokens · {candidate.model.cost}</span>
      </div>

      <section className="candidate-section">

            <input value={edits.title} onChange={(e) => change("title", e.target.value)} />
          </div>
          <div className={`field ${edits.summary !== candidate.event.summary ? "modified" : ""}`}>
            <label><span>摘要</span>{edits.summary !== candidate.event.summary && <span className="human-label">人工修改</span>}</label>
            <textarea value={edits.summary} onChange={(e) => change("summary", e.target.value)} />
          </div>
          <div className="field"><label><span>建议归档</span><span className="machine-label">92% 匹配</span></label><input value={candidate.event.match} readOnly /></div>
        </div>
      </section>

      <section className="candidate-section">
        <header className="candidate-section-header"><strong>候选实体</strong><span className="machine-label">{candidate.entities.length} 项</span></header>
        <div className="entity-list">
          {candidate.entities.map((entity) => <div className="entity-row" key={`${entity.name}-${entity.role}`}><span><strong>{entity.name}</strong><small>{entity.type}</small></span><span className="badge">{entity.role}</span></div>)}
        </div>
      </section>

      <section className="candidate-section">
        <header className="candidate-section-header"><strong>候选主张与证据</strong><span className="machine-label">{candidate.claims.length} 项</span></header>
        {candidate.claims.map((claim, index) => (
          <article className="claim-card" key={claim.id}>
            <div className="claim-head"><span className="claim-id">C{index + 1}</span><span>{edits[`claim${index}`] !== claim.text && <span className="human-label">人工修改</span>} <span className="confidence">模型置信 {Math.round(claim.strength * 100)}%</span></span></div>
            <div className="field"><textarea value={edits[`claim${index}`]} onChange={(e) => change(`claim${index}`, e.target.value)} /></div>
            {edits[`claim${index}`] !== claim.text && <div className="machine-original"><span className="machine-label">机器原值</span>{claim.text}</div>}
            <div className="evidence-quote"><span className="evidence-marker">E{index + 1}</span>{claim.evidence}</div>
          </article>
        ))}
      </section>

      {previewOpen && (
        <section className="preview-box">
          <header><strong>确认后的可见变化</strong><span className="formal-label">FORMAL</span></header>
          <div className="preview-copy">
            <strong>{targetText}</strong>；原材料与机器原值都保持不可变。
            {disposition === "驳回" ? (
              <ul><li>驳回原因：{rejectionReason}</li><li>候选标记为已驳回，并保留人工决定。</li><li>正式事件档案和报告区不会出现这些内容。</li></ul>
            ) : (
              <ul>
                <li>写入 {candidate.claims.length} 条人工确认主张，并分别回链原句。</li>
                <li>采用当前人工编辑值；机器原值继续保留用于审计。</li>
                <li>正式报告区可引用这些主张；原材料本身保持不可变。</li>
              </ul>
            )}
          </div>
        </section>
      )}

      <footer className="disposition">
        <div className="disposition-options">
          {["新建", "合并", "修改", "驳回"].map((option) => (
            <button className={`disposition-option ${disposition === option ? "active" : ""}`} key={option} onClick={() => setDisposition(option)}>{option}</button>

        <div className="disposition-actions">
          <button className="ghost-button button-small" disabled={disposition === "驳回" && !rejectionReason.trim()} onClick={onPreview}>{previewOpen ? "收起预览" : "预览影响"}</button>
          <button className="primary-button button-small" disabled={!previewOpen} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </footer>
    </>
  );
}

function CommandPalette({ open, query, setQuery, items, onChoose, onClose }) {

    </div>
  );

function ReviewScreen({ selectedReviewId, setSelectedReviewId, notify, navigate, onConfirmed, outcomes, onOutcome }) {
  const reviewItems = DATA.reviewItems.map((item) => outcomes[item.id] ? { ...item, ...outcomes[item.id], hasCandidate: false } : item);
  const selectedItem = reviewItems.find((item) => item.id === selectedReviewId) || reviewItems[0];
  const pendingCount = reviewItems.filter((item) => !["rejected", "confirmed"].includes(item.status)).length;
  const detail = DATA.reviewDetails[selectedItem.id] || {};
  const candidate = detail.candidate || (selectedItem.id === "intake-sca-v4" ? DATA.candidate : null);
  const makeEdits = (sourceCandidate) => {
    if (!sourceCandidate) return {};
    return sourceCandidate.claims.reduce((values, claim, index) => ({ ...values, [`claim${index}`]: claim.text }), {
      title: sourceCandidate.event.title,
      summary: sourceCandidate.event.summary,
    });
  };
  const [documentView, setDocumentView] = React.useState("material");
  const [disposition, setDisposition] = React.useState("合并");
  const [previewOpen, setPreviewOpen] = React.useState(false);
  const [rejectionReason, setRejectionReason] = React.useState("");
  const [mobileStep, setMobileStep] = React.useState(0);
  const [drafts, setDrafts] = React.useState({});
  const edits = drafts[selectedItem.id] || makeEdits(candidate);
  const setEdits = (updater) => setDrafts((allDrafts) => {
    const current = allDrafts[selectedItem.id] || makeEdits(candidate);
    const next = typeof updater === "function" ? updater(current) : updater;
    return { ...allDrafts, [selectedItem.id]: next };
  });

  React.useEffect(() => {
    setPreviewOpen(false);
    setRejectionReason("");
    setDocumentView("material");
    setDisposition(candidate?.event.match?.startsWith("EVT-") ? "合并" : "新建");
  }, [selectedReviewId]);

  React.useEffect(() => setPreviewOpen(false), [disposition]);
  React.useEffect(() => setPreviewOpen(false), [rejectionReason]);

  const confirm = () => {
    if (!previewOpen || !candidate) return;
    if (disposition === "驳回") {
      onOutcome(selectedItem.id, { status: "rejected", type: "已驳回", eventMatch: `原因：${rejectionReason}` });
      notify("候选已驳回", "正式事件、主张与报告均未改变；人工决定已保留用于审计");
      setPreviewOpen(false);
      return;
    }
    onOutcome(selectedItem.id, { status: "confirmed", type: "已入档", eventMatch: `${disposition}完成 · 人工决定已记录` });
    onConfirmed({ disposition, candidate, edits });
    notify("人工确认已记录", `${candidate.claims.length} 条主张将以“${disposition}”方式进入正式档案`);
    window.setTimeout(() => navigate("events"), 750);
  };

  const paneClass = (step, extra = "") => `review-pane ${extra} ${mobileStep === step ? "mobile-active" : ""}`;

  return (
    <section className="screen" data-screen-label="三栏人工审核台">
      <PageHeading
        eyebrow="HUMAN REVIEW BOUNDARY"
        title="待审箱"
        description="左边选材料，中间核对不可变原文和版本差异，右边编辑机器候选并预览正式区变化。AI 只能提议，人工确认后才入档。"
        actions={<StatusPill label={`${pendingCount} 项待处理`} tone="purple" />}
      />
      <nav className="mobile-review-steps" aria-label="移动端审核步骤">
        {["1 选择材料", "2 核对原文", "3 决定入档"].map((label, index) => <button key={label} className={mobileStep === index ? "active" : ""} onClick={() => setMobileStep(index)}>{label}</button>)}
      </nav>
      <div className="review-shell">
        <aside className={paneClass(0)}>
          <div className="pane-header"><span><strong>待审队列</strong><small>按优先级与时间排序</small></span><StatusPill label={String(pendingCount)} tone="purple" /></div>
          <ReviewQueue items={reviewItems} selectedId={selectedItem.id} onSelect={setSelectedReviewId} />
          <div className="mobile-next"><button className="primary-button button-small" onClick={() => setMobileStep(1)}>核对这份材料 →</button></div>
        </aside>

        <main className={paneClass(1)}>
          <div className="pane-header"><span><strong>原始材料与证据</strong><small>{selectedItem.id}</small></span>{selectedItem.hasSnapshot ? <StatusPill label="快照已固定" tone="cyan" /> : <StatusPill label="无快照" tone="red" />}</div>
          {selectedItem.hasSnapshot ? (
            <DocumentPane item={selectedItem} candidate={candidate} detail={detail} view={documentView} setView={setDocumentView} />
          ) : (
            <div className="empty-state"><strong>{selectedItem.title}</strong>抓取阶段没有得到快照，因此不会生成候选或改动正式区。<div className="button-row" style={{ justifyContent: "center", marginTop: 12 }}><button className="danger-button button-small" onClick={() => notify("已重新排队抓取", "仍需成功固定原页快照，之后才会运行候选生成")}>重试采集</button></div></div>
          )}
          <div className="mobile-next"><button className="primary-button button-small" disabled={!selectedItem.hasCandidate} onClick={() => setMobileStep(2)}>查看候选 →</button></div>
        </main>

        <aside className={paneClass(2, "candidate-pane")}>
          <div className="pane-header"><span><strong>候选与人工决定</strong><small>机器原值、人工修改、正式结果分离</small></span>{selectedItem.hasCandidate ? <StatusPill label="未确认" tone="purple" /> : <StatusPill status={selectedItem.status} />}</div>
          {selectedItem.hasCandidate && candidate ? (
            <CandidatePane
              candidate={candidate}
              disposition={disposition}
              setDisposition={setDisposition}
              edits={edits}
              setEdits={setEdits}
              onPreview={() => setPreviewOpen((open) => !open)}
              previewOpen={previewOpen}
              onConfirm={confirm}
              rejectionReason={rejectionReason}
              setRejectionReason={setRejectionReason}
            />
          ) : ["rejected", "confirmed"].includes(selectedItem.status) ? (
            <div className="empty-state"><strong>{selectedItem.status === "rejected" ? "候选已驳回" : "候选已进入正式档案"}</strong>{selectedItem.eventMatch}<br />原始快照、机器原值与人工决定仍可审计。</div>
          ) : selectedItem.failureStage === "generation" ? (
            <div className="empty-state"><strong>快照已保存，但候选生成失败</strong>原始 API 响应仍可在中栏核对；模型结构无效不会抹掉快照，也不会写入正式档案。<div className="button-row" style={{ justifyContent: "center", marginTop: 12 }}><button className="primary-button button-small" onClick={() => notify("已重新排队生成", "复用 V21 快照，不会重新请求上游 API")}>重新生成候选</button></div></div>
          ) : <div className="empty-state"><strong>抓取阶段尚无快照</strong>请先重试采集；只有固定原始材料后才能生成候选。</div>}
        </aside>
      </div>
    </section>
  );
}

      </div>

      <div className="events-layout" style={{ marginTop: 14 }}>
        <Surface title={tab === "claims" ? "已确认主张与证据" : "档案内容"} subtitle="来源可靠性与信息置信度分别呈现">
          {tab === "claims" ? (
            <div className="claims-table">
              {claimRows.map((claim, index) => (
                <div className="claim-row" key={index}>
                  <span className="claim-check">✓</span>
                  <div className="claim-text">{claim.text}</div>
                  <div className="claim-source"><strong>{claim.source}</strong>{claim.count}</div>
                  <StatusPill label={claim.status} tone={claim.tone} />
                </div>
              ))}
            </div>
          ) : tab === "overview" ? (
            <div className="surface-body"><div className="impact-list"><div className="impact-card"><small>时间</small><strong>{event.time}</strong></div><div className="impact-card"><small>地点</small><strong>{event.location}</strong></div><div className="impact-card"><small>证据规模</small><strong>{event.sources} 个来源 · {event.evidence} 条证据</strong></div></div></div>
          ) : tab === "sources" ? (
            isNewEvent ? <div className="surface-body"><div className="impact-card"><small>当前来源</small><strong>{recentConfirmation.candidate.entities[0]?.name} · 1 个不可变快照</strong></div></div> : <div className="surface-body"><div className="impact-list"><div className="impact-card"><small>官方机构</small><strong>Suez Canal Authority · 4 个不可变快照</strong></div><div className="impact-card"><small>港口管理方</small><strong>Port Said Authority RSS · 2 个文档</strong></div><div className="impact-card"><small>媒体来源</small><strong>Reuters · 仅用于独立印证与争议记录</strong></div></div></div>
          ) : (
            <div className="timeline"><div className="timeline-item"><small>刚刚</small><strong>{recentConfirmation ? `人工${recentConfirmation.disposition}并采用最终编辑值` : "人工确认 2 条新主张，保留 V4 证据回链"}</strong></div>{!isNewEvent && <><div className="timeline-item"><small>今天 10:43</small><strong>V4 内容变化进入待审箱</strong></div><div className="timeline-item"><small>昨天 18:22</small><strong>创建事件并确认首批 3 条主张</strong></div></>}</div>
          )}
        </Surface>
        <aside className="right-rail">
          {recentConfirmation ? (
            <Surface title="本次入档影响" subtitle={`来自刚才的人工“${recentConfirmation.disposition}”`}>
              <div className="surface-body">
                <div className="evidence-check">{impactCopy}</div>
                <div className="coverage-note">仍需独立来源交叉验证；系统不会因为第一方来源就自动标记为多源印证。</div>
              </div>
            </Surface>
          ) : (
            <Surface title="最近正式变化" subtitle="没有本次会话内的入档操作">
              <div className="surface-body"><div className="impact-card"><small>最近确认</small><strong>昨天 18:22 · 创建事件并确认首批主张</strong></div></div>
            </Surface>
          )}
          <Surface title="证据链完整性" subtitle={`${event.evidence} 条证据`}>
            <div className="surface-body"><div className="health-list"><HealthRow label="原句可定位" detail={`${event.evidence} / ${event.evidence}`} value={100} /><HealthRow label="快照哈希" detail={`${event.evidence} / ${event.evidence}`} value={100} /><HealthRow label="多源印证" detail={isNewEvent ? `0 / ${event.claims} 主张` : "3 / 5 主张"} value={isNewEvent ? 0 : 60} tone="amber" /></div></div>
          </Surface>
        </aside>
      </div>
    </section>
  );
}

function CaptureDialog({ open, onClose, onChoose }) {
  const [mode, setMode] = React.useState("inputs");
  const [keyword, setKeyword] = React.useState("Suez Canal northbound convoy resumption");
  const [searchRan, setSearchRan] = React.useState(false);
  React.useEffect(() => {
    if (open) {
      setMode("inputs");
      setSearchRan(false);
    }
  }, [open]);
  if (!open) return null;
  const inputs = [
    { id: "url", icon: "↗", title: "网页 / RSS", detail: "固定 URL 定时检查，保存每次版本" },
    { id: "api", icon: "{}", title: "确定 API", detail: "按字段映射接入结构化数据" },
    { id: "text", icon: "¶", title: "粘贴文本", detail: "保留提交原文并生成待审候选" },
    { id: "file", icon: "▤", title: "本地文件", detail: "PDF、HTML、Markdown 或纯文本" },
    { id: "search", icon: "⌕", title: "关键词发现", detail: "主动搜索线索；抓取原页后才可作为证据" },
  ];
  return (
    <div className="command-overlay" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
      <section className="capture-dialog" role="dialog" aria-modal="true" aria-label="添加输入">
        <header>
          <div>
            <p className="page-eyebrow">{mode === "search" ? "KEYWORD DISCOVERY" : "PARALLEL INPUTS"}</p>
            <h2>{mode === "search" ? "用关键词主动发现线索" : "从哪里添加材料？"}</h2>
            <p>{mode === "search" ? "搜索结果只是线索；必须成功抓取原页与固定快照，才能送入待审箱。" : "这些入口是并行输入；都先进入受控采集与待审边界，不会直接改正式档案。"}</p>
          </div>
          <button className="icon-button" onClick={onClose} aria-label="关闭">×</button>
        </header>
        {mode === "inputs" ? (
          <div className="capture-grid">
            {inputs.map((input) => <button className={`capture-option ${input.id === "search" ? "featured" : ""}`} key={input.id} onClick={() => input.id === "search" ? setMode("search") : onChoose(input)}><span className="capture-icon">{input.icon}</span><span><strong>{input.title}</strong><small>{input.detail}</small></span>{input.id === "search" && <span className="badge tone-cyan">可主动发现</span>}</button>)}
          </div>
        ) : (
          <div className="search-discovery">
            <div className="search-form-row">
              <button className="icon-button" onClick={() => setMode("inputs")} aria-label="返回输入选择">←</button>
              <input className="search-input" value={keyword} onChange={(event) => setKeyword(event.target.value)} aria-label="搜索关键词" />
              <button className="primary-button" onClick={() => setSearchRan(true)}>搜索</button>
            </div>
            <div className="search-scope-row"><StatusPill label="开放网页" tone="cyan" /><span>时间范围：过去 7 天</span><span>语言：自动</span><span>最多 20 条</span></div>
            {searchRan ? (
              <div className="discovery-results">
                <div className="discovery-summary"><strong>发现 3 条可抓取线索</strong><span>结果已去重；尚未成为 PLDR 证据</span></div>
                {[
                  { host: "suezcanal.gov.eg", title: "Statement on the phased resumption of northbound transit", meta: "18 分钟前 · 官方机构", match: "与 EVT-2026-014 高度相关" },
                  { host: "reuters.com", title: "Shipping operators await confirmed Suez transit window", meta: "51 分钟前 · 媒体来源", match: "可能提供独立印证" },
                  { host: "portsaid.gov.eg", title: "Northbound vessel waiting statistics updated", meta: "1 小时前 · 港口管理方", match: "可能补充影响规模" },
                ].map((result, index) => (
                  <article className="discovery-result" key={result.host}>
                    <div className="result-index">{String(index + 1).padStart(2, "0")}</div>
                    <div><small>{result.host}</small><strong>{result.title}</strong><p>{result.meta} · {result.match}</p></div>
                    <button className="ghost-button button-small" onClick={() => onChoose({ id: "search", title: "关键词发现" })}>抓取原页</button>
                  </article>
                ))}
              </div>
            ) : (
              <div className="search-empty"><span>⌕</span><strong>先搜索，再决定抓取哪条原页</strong><p>搜索接口不会直接生成事件、主张或证据，也不会把摘要当作原文。</p></div>
            )}
          </div>
        )}
        <footer>{mode === "search" ? "发现 → 选择结果 → 抓取原页 → 固定快照 → AI 生成候选 → 人工确认。" : "固定来源负责持续监测；关键词搜索用于补齐未知线索；两者最终都必须抓到可追溯原文。"}</footer>
      </section>
    </div>
  );
}

function App() {
  const hashRoute = window.location.hash.replace("#", "");
  const [activeRoute, setActiveRoute] = React.useState(ROUTES.has(hashRoute) ? hashRoute : "today");
  const [sourceFilter, setSourceFilter] = React.useState("all");
  const [selectedSourceId, setSelectedSourceId] = React.useState("src-sca");
  const [selectedReviewId, setSelectedReviewId] = React.useState("intake-sca-v4");
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [paletteQuery, setPaletteQuery] = React.useState("");
  const [captureOpen, setCaptureOpen] = React.useState(false);
  const [recentConfirmation, setRecentConfirmation] = React.useState(null);
  const [reviewOutcomes, setReviewOutcomes] = React.useState({});
  const [toast, setToast] = React.useState(null);
  const remainingReviewCount = DATA.reviewItems.filter((item) => !reviewOutcomes[item.id]).length;
  const visibleNavItems = NAV_ITEMS.map((item) => item.id === "review" ? { ...item, count: remainingReviewCount } : item);

  const navigate = React.useCallback((route) => {
    if (!ROUTES.has(route)) return;
    setActiveRoute(route);
    window.location.hash = route;
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  const notify = React.useCallback((title, detail) => {
    setToast({ title, detail });
    window.clearTimeout(window.__pldrToastTimer);
    window.__pldrToastTimer = window.setTimeout(() => setToast(null), 3200);
  }, []);

  React.useEffect(() => {
    const onHash = () => {
      const next = window.location.hash.replace("#", "");
      if (ROUTES.has(next)) setActiveRoute(next);
    };
    const onKey = (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        setPaletteOpen((open) => !open);
      }
      if (event.key === "Escape") {
        setPaletteOpen(false);
        setCaptureOpen(false);
      }
    };
    window.addEventListener("hashchange", onHash);
    window.addEventListener("keydown", onKey);
    if (!window.location.hash) window.history.replaceState(null, "", "#today");
    return () => {
      window.removeEventListener("hashchange", onHash);
      window.removeEventListener("keydown", onKey);
    };
  }, []);

  const commands = [
    ...NAV_ITEMS.map((item) => ({ id: `route-${item.id}`, icon: item.icon, label: `打开${item.label}`, hint: "页面", route: item.id })),
    { id: "capture", icon: "+", label: "添加网页、文本、文件或搜索任务", hint: "输入", action: "capture" },
    { id: "event", icon: "E", label: "打开 EVT-2026-014 苏伊士航道恢复评估", hint: "事件", route: "events" },
  ];

  const chooseCommand = (item) => {
    setPaletteOpen(false);
    setPaletteQuery("");
    if (item.route) navigate(item.route);
    if (item.action === "capture") setCaptureOpen(true);
  };

  const chooseCapture = (input) => {
    setCaptureOpen(false);
    if (input.id === "search") {
      notify("已创建搜索发现采集项", "正在抓取所选原页；成功固定快照后才会进入待审箱");
    } else {
      notify(`已选择${input.title}`, "原型只演示入口；提交前会先显示试抓与证据预览");
    }
  };

  const openStat = (stat) => {
    if (stat.id === "new") {
      setSelectedReviewId("intake-port-28");
      navigate("review");
    } else if (stat.id === "failed") {
      setSourceFilter("failed");
      setSelectedSourceId("src-marine");
      navigate("sources");
    } else {
      navigate(stat.route);
    }
  };

  const openAttention = (item) => {
    if (item.id === "att-port") setSelectedReviewId("intake-port-28");
    if (item.id === "att-sca") setSelectedReviewId("intake-sca-v4");
    if (item.id === "att-failure") {
      setSourceFilter("failed");
      setSelectedSourceId("src-marine");
    }
    navigate(item.action || "review");
  };

  let screen;
  if (activeRoute === "sources") screen = <SourcesScreen filter={sourceFilter} setFilter={setSourceFilter} selectedSourceId={selectedSourceId} setSelectedSourceId={setSelectedSourceId} notify={notify} navigate={navigate} openCapture={() => setCaptureOpen(true)} />;
  else if (activeRoute === "changes") screen = <ChangesScreen navigate={navigate} notify={notify} />;
  else if (activeRoute === "review") screen = <ReviewScreen selectedReviewId={selectedReviewId} setSelectedReviewId={setSelectedReviewId} notify={notify} navigate={navigate} onConfirmed={setRecentConfirmation} outcomes={reviewOutcomes} onOutcome={(id, outcome) => setReviewOutcomes((old) => ({ ...old, [id]: outcome }))} />;
  else if (activeRoute === "events") screen = <EventsScreen navigate={navigate} recentConfirmation={recentConfirmation} />;
  else screen = <TodayScreen navigate={navigate} openCapture={() => setCaptureOpen(true)} openStat={openStat} openAttention={openAttention} />;

  return (
    <div className="app-shell">
      <aside className="sidebar">
        <div className="sidebar-brand"><span className="brand-mark">P</span><span><strong>PLDR</strong><small>证据优先研判台</small></span></div>
        <nav className="nav-section" aria-label="主导航">
          <div className="nav-label">Workbench</div>
          {visibleNavItems.map((item) => <NavButton item={item} key={item.id} active={activeRoute === item.id} onClick={() => navigate(item.id)} />)}
        </nav>
        <div className="sidebar-context">
          <div className="context-line"><span className="status-dot"></span><span>采集器正常 · 28/30</span></div>
          <div className="context-line"><span className="status-dot amber"></span><span>2 个来源覆盖缺失</span></div>
          <div className="context-line"><span className="status-dot"></span><span>模型候选隔离正常</span></div>
        </div>
        <div className="sidebar-version">P1 DESIGN PROTOTYPE<br />MOCK DATA · 2026-08-29</div>
      </aside>

      <header className="topbar">
        <div className="topic-switcher"><span><span className="topic-kicker">当前专题</span><span className="topic-name">海运关键通道与物流扰动</span></span></div>
        <span className="range-pill">过去 24 小时</span>
        <div className="topbar-spacer"></div>
        <button className="command-trigger" onClick={() => setPaletteOpen(true)}><span>搜索或跳转…</span><kbd>Ctrl K</kbd></button>
        <button className="ghost-button" onClick={() => navigate("sources")}><span className="status-dot"></span>系统状态</button>
        <button className="primary-button" onClick={() => setCaptureOpen(true)}>＋ 添加输入</button>
      </header>

      <main className="main">{screen}</main>

      <nav className="bottom-nav" aria-label="移动端主导航">
        {visibleNavItems.map((item) => <button className={activeRoute === item.id ? "active" : ""} key={item.id} onClick={() => navigate(item.id)}><span>{item.icon}</span><span>{item.label}</span></button>)}
      </nav>

      <CommandPalette open={paletteOpen} query={paletteQuery} setQuery={setPaletteQuery} items={commands} onChoose={chooseCommand} onClose={() => setPaletteOpen(false)} />
      <CaptureDialog open={captureOpen} onClose={() => setCaptureOpen(false)} onChoose={chooseCapture} />
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
  </body>
</html>
